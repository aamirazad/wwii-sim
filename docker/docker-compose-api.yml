services:
  api:
    image: ghcr.io/aamirazad/wwii-sim/api:latest
    ports:
      - "3001:3001"
    environment:
      DB_FILE_NAME: /data/db.sqlite
      CORS_ORIGIN: "http://localhost:3000"
      APP_URL: ${APP_URL:-http://localhost:3000}
      GAME_TIME_ZONE: ${GAME_TIME_ZONE:-America/New_York}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailgun.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - ./data:/data
    restart: unless-stopped
